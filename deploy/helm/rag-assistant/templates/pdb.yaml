apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rag-assistant.fullname" . }}
  labels:
    {{- include "rag-assistant.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "rag-assistant.selectorLabels" . | nindent 6 }}
